};
$("forgot").onclick=()=>{
  const e=$("em").value.trim().toLowerCase();
  if(e.indexOf("@")<1)return err("e_resetNeed");
  sendPasswordResetEmail(auth,e).then(()=>msg("resetSent",true)).catch(()=>msg("resetSent",true));
};
const steps=[
 {k:"name",l:"s_name",t:"text",ph:"ph_name",ac:"name"},
 {k:"dob",l:"s_dob",t:"date"},
 {k:"email",l:"s_email",t:"email",ph:"",ac:"email"},
 {k:"pw",l:"s_pw",t:"password",ph:"ph_pw",ac:"new-password"},
 {k:"phone",l:"s_phone",t:"tel",ph:"",ac:"tel",opt:1}
];let si=0,data={};
function showStep(){
  const st=steps[si],w=$("wi");
  $("prog").textContent=t("step",{a:si+1,b:steps.length});
  $("lbl").textContent=t(st.l);w.type=st.t;w.placeholder=st.ph?t(st.ph):"";w.autocomplete=st.ac||"off";
  w.max=st.t=="date"?new Date().toISOString().slice(0,10):"";
  w.value=data[st.k]||"";$("note").textContent="";
  $("wNext").textContent=t(si==steps.length-1?"finish":"next");
  show("wSkip",!!st.opt);show("wPrev",si>0);
}
function setMode(m){mode=m;
  $("tLog").classList.toggle("on",m=="log");$("tSign").classList.toggle("on",m=="sign");
  show("logForm",m=="log");show("wiz",m=="sign");$("note").textContent="";
  if(m=="sign"){si=0;data={};showStep()}}
$("tLog").onclick=()=>setMode("log");
$("tSign").onclick=()=>setMode("sign");
function check(st,v){
  if(st.k=="name")return v.length>=2||err("e_name");
  if(st.k=="dob"){if(!v)return err("e_dob");const d=new Date(v),n=new Date();
    if(d>n)return err("e_dob");
    const age=n.getFullYear()-d.getFullYear()-((n.getMonth()<d.getMonth()||(n.getMonth()==d.getMonth()&&n.getDate()<d.getDate()))?1:0);
    return age>=13||err("e_age");}
  if(st.k=="email")return (v.indexOf("@")>0&&v.indexOf(".")>0)||err("e_mail");
  if(st.k=="pw")return v.length>=6||err("e_pw");
  if(st.k=="phone")return v===""||/^\+?\d{7,15}$/.test(v.replace(/[\s-]/g,""))||err("e_phone");
  return true;
}
async function next(skip){
  const st=steps[si],v=skip?"":$("wi").value.trim();
  if(!check(st,v))return;
  data[st.k]=v;
  if(si<steps.length-1){si++;showStep();return}
  signing=true;
  try{
    const c=await createUserWithEmailAndPassword(auth,data.email.toLowerCase(),data.pw);
    await setDoc(doc(db,"users",c.user.uid),{name:data.name,email:data.email.toLowerCase(),dob:data.dob,phone:data.phone||"",avatar:"",createdAt:serverTimestamp()});
    sendEmailVerification(c.user).catch(()=>{});
    signing=false;await enter(c.user,true);addNotif(t("verifyN"));
  }catch(x){signing=false;
    if((x.code||"").includes("email-already-in-use")){si=2;showStep()}
    err(fe(x))}
}
$("wNext").onclick=()=>next(false);
$("wSkip").onclick=()=>next(true);
$("wPrev").onclick=()=>{if(si>0){data[steps[si].k]=$("wi").value.trim();si--;showStep()}};
$("wi").onkeydown=e=>{if(e.key=="Enter"){e.preventDefault();next(false)}};

onAuthStateChanged(auth,async u=>{
  if(signing)return;
  if(!u){me=null;if(unsub){unsub();unsub=null}closeM();show("dd",false);show("app",false);show("auth",true);show("login",false);show("choose",true);setMode("log");return}
  const f=freshNext;freshNext=false;await enter(u,f);
});
async function enter(u,fresh){
  let p;
  if(u.isAnonymous){
    let g=ls("g_"+u.uid,null);
    if(!g){g={name:t("guestN")+" "+Math.floor(1000+Math.random()*9000),avatar:""};sv("g_"+u.uid,g)}
    p=g;
  }else{
    const s=await getDoc(doc(db,"users",u.uid));
    if(s.exists())p=s.data();
    else{p={name:u.displayName||u.email.split("@")[0],email:u.email,dob:"",phone:"",avatar:u.photoURL||""};
      await setDoc(doc(db,"users",u.uid),Object.assign({},p,{createdAt:serverTimestamp()}))}
  }
  me={id:u.uid,email:u.email||"",name:p.name,avatar:p.avatar||"",guest:u.isAnonymous};
  show("auth",false);show("app",true);
  if(fresh)addNotif(t("nWelcome",{n:me.name}));
  updMenu();startMsgs();updBadge();
}

/* المحادثة */
function startMsgs(){
  if(unsub)unsub();let first=true;
  unsub=onSnapshot(query(collection(db,"messages"),orderBy("t"),limitToLast(100)),snap=>{
    msgs=snap.docs.map(d=>Object.assign({id:d.id},d.data()));render();
    if(!first)snap.docChanges().forEach(c=>{if(c.type=="added"&&!c.doc.metadata.hasPendingWrites){const m=c.doc.data();if(m.uid!==me.id)addNotif(m.n+": "+String(m.text).slice(0,60))}});
    first=false;
  });
}
function render(){
  const box=$("msgs");box.textContent="";
  msgs.forEach(r=>{
    const mine=r.uid===me.id,el=document.createElement("div");el.className="m"+(mine?" me":"");
    const n=document.createElement("div");n.className="n";n.textContent=mine?t("you"):r.n;
    const x=document.createElement("div");x.textContent=r.text;
    el.appendChild(n);el.appendChild(x);box.appendChild(el);
  });
  box.scrollTop=box.scrollHeight;
}
$("f").onsubmit=e=>{
  e.preventDefault();
  const i=$("t"),v=i.value.trim();if(!v)return;
  i.value="";
  addDoc(collection(db,"messages"),{uid:me.id,n:me.name,text:v.slice(0,500),t:Date.now()}).catch(()=>{i.value=v});
};

/* القائمة */
function av(el,p){el.textContent="";el.style.backgroundImage="";
  if(p.avatar)el.style.backgroundImage="url("+p.avatar+")";else el.textContent=(p.name||"?").trim().charAt(0).toUpperCase()}
function updMenu(){av($("miAv"),me);$("miN").textContent=me.name;show("miA",isAdmin())}
$("bg").onclick=e=>{e.stopPropagation();show("dd",$("dd").classList.contains("hidden"))};
document.addEventListener("click",e=>{if(!$("dd").contains(e.target))show("dd",false)});
$("miP").onclick=()=>{show("dd",false);profileM()};
$("miN2").onclick=()=>{show("dd",false);notifM()};
$("miS").onclick=()=>{show("dd",false);settingsM()};
$("miA").onclick=()=>{show("dd",false);adminM()};

function openM(title,build){const b=$("md");b.textContent="";const h=document.createElement("h2");h.textContent=title;b.appendChild(h);build(b);
  const c=document.createElement("button");c.className="big ghost";c.textContent=t("close");c.onclick=closeM;b.appendChild(c);show("ov",true)}
function closeM(){show("ov",false)}
$("ov").onclick=function(e){if(e.target==this)closeM()};
function btn(txt,cls,fn){const b=document.createElement("button");b.className="big "+cls;b.textContent=txt;b.onclick=fn;return b}

function profileM(){
  openM(t("editP"),b=>{
    let tmp=me.avatar;const box=document.createElement("div");box.style.textAlign="center";
    const a=document.createElement("div");a.className="av";a.style.cssText="width:90px;height:90px;font-size:36px;margin:0 auto 10px";av(a,{name:me.name,avatar:tmp});
    const f=document.createElement("input");f.type="file";f.accept="image/*";f.className="hidden";
    f.onchange=()=>{const fl=f.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const c=document.createElement("canvas");c.width=c.height=128;const s=Math.min(im.width,im.height),x=c.getContext("2d");
      x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);tmp=c.toDataURL("image/jpeg",.8);av(a,{name:me.name,avatar:tmp})};im.src=r.result};r.readAsDataURL(fl)};
    const ph=btn(t("photo"),"ghost",()=>f.click());
    const nm=document.createElement("input");nm.className="f";nm.value=me.name;nm.placeholder=t("nameL");
    const sb=btn(t("save"),"primary",async()=>{
      const v=nm.value.trim();if(v.length<2)return;
      me.name=v;me.avatar=tmp;
      try{if(me.guest)sv("g_"+me.id,{name:v,avatar:tmp});else await updateDoc(doc(db,"users",me.id),{name:v,avatar:tmp})}catch(x){}
      updMenu();closeM()});
    box.append(a,f,ph,nm,sb);b.appendChild(box)});
}
const nKey=()=>"chat_notifs_"+me.id;
function addNotif(x){if(ls("chat_nOn",true)===false)return;const a=ls(nKey(),[]);a.unshift({x:x,t:Date.now(),r:0});sv(nKey(),a.slice(0,30));updBadge()}
function updBadge(){if(!me)return;const n=ls(nKey(),[]).filter(o=>!o.r).length;$("bd").textContent=n;show("bd",n>0)}
function notifM(){
  const a=ls(nKey(),[]);
  openM(t("notif"),b=>{
    if(!a.length){const e=document.createElement("div");e.className="sm";e.textContent=t("nEmpty");b.appendChild(e)}
    a.forEach(o=>{const d=document.createElement("div");d.className="nt"+(o.r?"":" u");d.textContent=o.x;
      const s=document.createElement("div");s.className="sm";s.textContent=new Date(o.t).toLocaleString(lg);d.appendChild(s);b.appendChild(d)});
    if(a.length)b.appendChild(btn(t("nClear"),"ghost",()=>{sv(nKey(),[]);updBadge();notifM()}));
  });
  a.forEach(o=>{o.r=1});sv(nKey(),a);updBadge();
}
function settingsM(){
  openM(t("settings"),b=>{
    const r1=document.createElement("div");r1.className="row";const l1=document.createElement("span");l1.textContent=t("lang");
    const s=document.createElement("select");s.className="lgs";fillLang(s);s.onchange=()=>{setLang(s.value);settingsM()};r1.append(l1,s);
    const r2=document.createElement("div");r2.className="row";const l2=document.createElement("span");l2.textContent=t("nOn");
    const c=document.createElement("input");c.type="checkbox";c.checked=ls("chat_nOn",true)!==false;c.onchange=()=>sv("chat_nOn",c.checked);r2.append(l2,c);
    b.append(r1,r2);
    if(isAdmin())b.appendChild(btn(t("clearChat"),"ghost",async()=>{try{const s=await getDocs(collection(db,"messages"));await Promise.all(s.docs.map(d=>deleteDoc(d.ref)))}catch(x){}}));
    b.appendChild(btn(t("logout"),"ghost",()=>signOut(auth)));
  });
}

/* لوحة المالك */
function adminM(){if(!isAdmin())return;openM("admin",b=>b.appendChild(btn("G And P","primary",gpM)))}
async function gpM(){
  if(!isAdmin())return;
  let list=null;
  try{await auth.currentUser.reload();await auth.currentUser.getIdToken(true);list=(await getDocs(collection(db,"users"))).docs.map(d=>d.data())}catch(x){}
  openM("G And P"+(list?" ("+list.length+")":""),b=>{
    if(!list){const e=document.createElement("div");e.className="sm";e.textContent=t("a_denied");b.appendChild(e);return}
    if(!list.length){const e=document.createElement("div");e.className="sm";e.textContent=t("a_none");b.appendChild(e)}
    list.forEach(o=>{const d=document.createElement("div");d.className="nt";
      const n=document.createElement("b");n.textContent=o.name||"";
      const l=document.createElement("div");l.className="sm";
      l.textContent=(o.email||"")+" | "+t("dob")+": "+(o.dob||"-")+" | "+t("phoneL")+": "+(o.phone||"-");
      d.append(n,l);b.appendChild(d)});
  });
}

/* البداية */
fillLang($("lg"));applyLang();
